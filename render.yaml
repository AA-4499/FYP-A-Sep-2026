services:
  - type: web
    name: diabetes-digital-twin-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.10

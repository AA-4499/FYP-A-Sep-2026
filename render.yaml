services:
  - type: web
    name: diabetes-digital-twin-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0" && pip install -r web/backend/requirements.txt
    startCommand: gunicorn --chdir web/backend -w 1 --threads 2 --timeout 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: OMP_NUM_THREADS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLINICAL_KG_NEO4J_URI
        value: neo4j+s://e72f4649.databases.neo4j.io
      - key: CLINICAL_KG_NEO4J_USER
        value: e72f4649
      - key: CLINICAL_KG_NEO4J_PASSWORD
        sync: false
      - key: CLINICAL_KG_NEO4J_DATABASE
        value: e72f4649
      - key: KG_AI_PROVIDER
        value: rules
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: diabetes-digital-twin-frontend
    runtime: static
    rootDir: web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

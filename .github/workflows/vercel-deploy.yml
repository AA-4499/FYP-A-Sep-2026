name: Vercel Deploy

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy Frontend to Vercel
    # Secrets are unavailable on pull requests from external forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel pull --yes --environment=production

      - name: Pull Vercel Environment (Preview)
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: vercel pull --yes --environment=preview

      - name: Build (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel build --prod

      - name: Build (Preview)
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: vercel build

      - name: Deploy (Production)
        id: deploy_prod
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "url=$(vercel deploy --prebuilt --prod)" >> "$GITHUB_OUTPUT"

      - name: Deploy (Preview)
        id: deploy_preview
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: echo "url=$(vercel deploy --prebuilt)" >> "$GITHUB_OUTPUT"

      - name: Publish URL to Job Summary
        run: |
          URL="${{ steps.deploy_prod.outputs.url || steps.deploy_preview.outputs.url }}"
          echo "### Vercel Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy_preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployment ready: ${{ steps.deploy_preview.outputs.url }}`
            })

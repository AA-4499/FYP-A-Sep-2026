name: CI

on:
  push:
    branches:
      - main
      - TrainingModel
  pull_request:
    branches:
      - main
      - TrainingModel

permissions:
  contents: read

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/backend/requirements.txt

      # Mirrors render.yaml so a broken Render build fails here first.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
          pip install -r web/backend/requirements.txt

      # The tests mock Supabase, so no project credentials are required.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s web/backend/tests -v

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

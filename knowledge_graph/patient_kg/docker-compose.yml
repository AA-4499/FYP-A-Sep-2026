services:
  patient-neo4j:
    image: neo4j:5.26-community
    container_name: patient-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: "${PATIENT_NEO4J_AUTH:-neo4j/patientkg2026}"
    volumes:
      - ./data:/data
      - ./logs:/logs

services:
  - type: web
    name: diabetes-digital-twin-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0" && pip install -r web/backend/requirements.txt
    startCommand: gunicorn --chdir web/backend -w 1 --threads 2 --timeout 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: OMP_NUM_THREADS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: static_site
    name: diabetes-digital-twin-frontend
    rootDir: web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
